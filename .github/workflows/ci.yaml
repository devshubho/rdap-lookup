name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate tlds.json
        run: python3 scripts/gen-tlds.py
      - name: Regenerate merged bootstrap
        run: |
          cargo run --quiet -- \
            --iana data/official/iana-rdap-bootstrap.json \
            --emit-bootstrap data/generated/dns.json
      - name: Publish copies
        run: |
          cp data/generated/dns.json site/dns.json
          cp data/manual/cctld-rdap-servers.json site/rdap-cctld-servers.json
          cp data/manual/punycode-rdap-servers.json site/punycode-rdap-servers.json
      - name: Fail if generated data is stale
        run: git diff --exit-code
