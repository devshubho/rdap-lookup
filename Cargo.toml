[package]
name = "rdap-lookup"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Curated RDAP server directory and client: IANA's bootstrap plus hand-maintained ccTLD servers, resolved from one stable URL."
license = "MIT"
repository = "https://github.com/devshubho/rdap-server"
readme = "README.md"
keywords = ["rdap", "whois", "dns", "tld", "cctld"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
idna = "1"
time = { version = "0.3", features = ["formatting"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
